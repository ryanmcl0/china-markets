# Run on a NAS instead of GitHub Actions. Run one or the other, never both:
# two copies would send every alert twice and race for Telegram messages.
# Before starting this, set the repo variable MONITOR_RUNNER=nas to pause Actions:
#   gh variable set MONITOR_RUNNER --body nas
services:
  monitor:
    build: .
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./state:/app/state
    restart: unless-stopped
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
